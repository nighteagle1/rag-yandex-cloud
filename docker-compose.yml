services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      # именованный том: bind-mount на Windows портит хранилище Qdrant
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  langflow:
    image: langflowai/langflow:1.12.3
    ports:
      - "127.0.0.1:7860:7860"
    env_file: .env
    environment:
      # локальная среда разработки: вход без логина, доступ только с localhost
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_SKIP_AUTH_AUTO_LOGIN: "true"
      LANGFLOW_CONFIG_DIR: /app/langflow
      DO_NOT_TRACK: "true"
      # разрешаем отправлять ключ из окружения только на OpenRouter
      LANGFLOW_PROVIDER_CREDENTIAL_ALLOWED_HOSTS: openrouter.ai
      LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT: OPENROUTER_API_KEY
    volumes:
      - ./langflow_data:/app/langflow
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
